music_directory		"/home/nullboy/music/"
playlist_directory	"/home/nullboy/.config/mpd/playlist"
db_file		"~/.local/state/mpd/database"
state_file	"~/.local/state/mpd/state"
sticker_file	"~/.local/state/mpd/sticker.sql"

auto_update "yes"
bind_to_address "127.0.0.1"
port "6600"
restore_paused "yes"
max_output_buffer_size "16384"

audio_output {
    type  "pulse"
    name  "pulse audio"
}

audio_output {
    type	"fifo"
    name	"Visualizer feed"
    path	"/tmp/mpd.fifo"
    format	"44100:16:2"
}
